<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação de Aluno</title>

    <script>
        class Aluno {
            constructor(nome) {
                this.nome = nome;
                this.notas = [];
            }

            adicionarNota(nota) {
                this.notas.push(nota);
            }

            calcularMedia() {
                let soma = 0;

                for (let nota of this.notas) {
                    soma += nota;
                }

                return soma / this.notas.length;
            }

            verificarAprovacao() {
                const media = this.calcularMedia();

                if (media >= 7) {
                    console.log(`${this.nome}: Aprovado`);
                } else if (media >= 5) {
                    console.log(`${this.nome}: Em Recuperação`);
                } else {
                    console.log(`${this.nome}: Reprovado`);
                }

                console.log(`Média: ${media.toFixed(1)}`);
            }
        }

        const aluno = new Aluno("Maria");

        aluno.adicionarNota(8);
        aluno.adicionarNota(7);
        aluno.adicionarNota(9);

        aluno.verificarAprovacao();
    </script>
</head>
